<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לוח משימות לילדים | Kids Tasker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Header Bar -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-20 px-4 sm:px-8 py-4 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-indigo-900/40">
          ⭐
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
            <span>לוח משימות יומי</span>
            <span id="family-title" class="text-xs sm:text-sm font-semibold text-indigo-400 bg-indigo-950/60 border border-indigo-800/60 px-2.5 py-0.5 rounded-full"></span>
          </h1>
          <p id="current-date" class="text-xs sm:text-sm text-slate-400 font-medium"></p>
        </div>
      </div>

      <!-- Navigation, TV Status Badge & Realtime Status Indicator -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Live TV Block Indicator -->
        <div id="tv-status-badge" class="hidden items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition">
          <!-- Injected dynamically -->
        </div>

        <a href="/parent.html" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-slate-600 shadow-sm transition">
          <span>⚙️</span>
          <span>ניהול הורים</span>
        </a>

        <div id="status-badge" class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-300">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="status-text" class="hidden sm:inline">מתחבר...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- Loading State -->
    <div id="loading-spinner" class="flex flex-col items-center justify-center py-24 gap-4">
      <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
      <p class="text-slate-400 font-medium animate-pulse text-lg">טוען משימות מהענן...</p>
    </div>

    <!-- Children Cards Grid -->
    <div id="board" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 items-start">
      <!-- Injected via tablet.js -->
    </div>
  </main>

  <!-- Tablet Toast Notification -->
  <div id="tablet-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800 border border-slate-700 text-white font-bold rounded-2xl shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

  <!-- Firebase Hosting auto-init (injected automatically by Firebase Hosting CDN) -->
  <script src="/__/firebase/init.js"></script>

  <!-- Modular Script -->
  <script type="module" src="/js/tablet.js"></script>
</body>
</html>
