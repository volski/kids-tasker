<div class="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm"
     role="dialog" aria-modal="true"
     (click)="onBackdropClick($event)">

  <div [class]="'bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-xs flex flex-col items-center gap-5 select-none mx-4 pin-box' + (isShaking() ? ' pin-shake' : '')">

    <div class="text-center">
      <div class="text-4xl mb-2">👑</div>
      <h2 class="text-xl font-black text-white">{{ title() }}</h2>
      <p class="text-sm text-slate-400 mt-1">{{ subtitle() }}</p>
    </div>

    <!-- Dots -->
    <div class="flex gap-3 items-center justify-center min-h-[2.5rem]">
      @for (filled of dots; track $index) {
        <div [class]="'w-4 h-4 rounded-full border-2 transition-all duration-150 ' + (filled ? 'bg-indigo-400 border-indigo-400 scale-110' : 'bg-transparent border-slate-600')"></div>
      }
    </div>

    <!-- Error -->
    @if (errorMsg()) {
      <p class="text-rose-400 text-sm font-bold text-center min-h-[1.25rem]">{{ errorMsg() }}</p>
    }

    <!-- Keypad -->
    <div class="grid grid-cols-3 gap-3 w-full">
      @for (d of digits; track d) {
        <button class="pin-key" (pointerdown)="$event.preventDefault(); onDigit(d)">{{ d }}</button>
      }
      <button class="pin-key pin-key-secondary text-sm" (pointerdown)="$event.preventDefault(); onCancel()">
        {{ cancelLabel() }}
      </button>
      <button class="pin-key" (pointerdown)="$event.preventDefault(); onDigit(0)">0</button>
      <button class="pin-key pin-key-del" (pointerdown)="$event.preventDefault(); onDelete()">⌫</button>
    </div>
  </div>
</div>
